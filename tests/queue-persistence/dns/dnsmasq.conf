no-resolv
no-hosts
# authoritative for the test subnet's reverse zone: PTR lookups get an
# instant NXDOMAIN instead of hanging into postfix's banner phase
local=/0.101.10.in-addr.arpa/
# alias domain served by mailforward itself
local=/fwd.local/
address=/.fwd.local/10.101.0.1
mx-host=fwd.local,mail.fwd.local,10
# forward target: MX points at fake-smtp's fixed address (10.101.0.99).
# While fake-smtp is stopped, delivery is refused and the accepted mail
# sits in mailforward's queue — exactly the state the persistence test
# carries across a container recreate.
local=/extern.local/
host-record=extern.local,10.101.0.99
host-record=mail.extern.local,10.101.0.99
mx-host=extern.local,mail.extern.local,10
