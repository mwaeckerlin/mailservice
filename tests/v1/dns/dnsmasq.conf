no-resolv
no-hosts

# The mail domain of the stack. The wildcard satisfies the recipient
# checks of the 1-line postfix, which reject an unresolvable domain.
local=/test.local/
address=/.test.local/10.1.1.1
mx-host=test.local,mail.test.local,10
txt-record=test.local,v=spf1 ip4:10.0.0.0/8 ip4:172.16.0.0/12 ip4:192.168.0.0/16 ~all

# The foreign MX: everything addressed to extern.local resolves to
# fake-smtp, which holds the fixed address 10.100.0.99 on dns-net. This
# is what makes the outbound test a real MX lookup plus a real SMTP
# delivery, with no mail leaving the machine.
local=/extern.local/
host-record=extern.local,10.100.0.99
host-record=mail.extern.local,10.100.0.99
mx-host=extern.local,mail.extern.local,10
txt-record=extern.local,v=spf1 ip4:10.0.0.0/8 ip4:172.16.0.0/12 ip4:192.168.0.0/16 ~all
