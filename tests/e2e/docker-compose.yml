services:

  dns:
    build: ./dns
    networks:
      dns-net:
        ipv4_address: 10.100.0.2
    healthcheck:
      test: ["CMD-SHELL", "nc -w1 127.0.0.1 53 </dev/null"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 3s

  # ────────────────────────────────────────────────────────────────────────
  # Three DKIM_DMARC modes, each with its own opendkim + opendmarc + postfix.
  # The three postfixes share dovecot/postgrey/db for delivery.
  #
  #   postfix              →  DKIM_DMARC=permissive  (Marc's design default)
  #   postfix-strict       →  DKIM_DMARC=reject      (also requires signature)
  #   postfix-log          →  DKIM_DMARC=log         (monitor mode)
  # ────────────────────────────────────────────────────────────────────────

  # permissive: bad-sig / unknown-key are rejected; unsigned is accepted.
  # TRUSTED_HOSTS narrow so the test-runner's RFC1918 IP is external and
  # opendkim actually runs its verify path (with wide TRUSTED_HOSTS, RFC1918
  # senders are treated as own users and the sign path takes over).
  opendkim:
    build: ../../opendkim
    environment:
      DOMAINS:       "test.local other.local"
      AUTHSERV_ID:   "mail.test.local"
      DKIM_DMARC:    "permissive"
      NAMESERVERS:   "10.100.0.2"
      # default TRUSTED_HOSTS (RFC1918) — test-runner IS internal so
      # outgoing test.local/other.local mail gets signed; ExternalIgnoreList
      # is hard-wired to loopback in init.cpp so verify still runs on
      # incoming from test-runner. Both operations happen in parallel.
    volumes:
      - dkim-keys:/etc/opendkim/keys
    dns: ["10.100.0.2"]
    depends_on:
      dns:
        condition: service_healthy
    networks: [dkim-net, dns-net]
    healthcheck:
      test: ["CMD", "/usr/bin/init", "--healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  opendmarc:
    build: ../../opendmarc
    environment:
      AUTHSERV_ID:   "mail.test.local"
      DKIM_DMARC:    "permissive"
      # narrow IgnoreHosts so test-runner (10.x) is DMARC-checked;
      # postfix-locally-generated mail (client IP 127.0.0.1 in the
      # milter callback) is still whitelisted
      TRUSTED_HOSTS: "127.0.0.1 ::1"
      NAMESERVERS:   "10.100.0.2"
    dns: ["10.100.0.2"]
    depends_on:
      dns:
        condition: service_healthy
    networks: [dkim-net, dns-net]
    healthcheck:
      test: ["CMD", "/usr/bin/init", "--healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  # reject: on top of permissive, also reject unsigned mail. opendmarc side
  # is identical to permissive (RejectFailures true either way) so the
  # `opendmarc` instance above is reused.
  opendkim-strict:
    build: ../../opendkim
    environment:
      DOMAINS:       "test.local other.local"
      AUTHSERV_ID:   "mail.test.local"
      DKIM_DMARC:    "reject"
      NAMESERVERS:   "10.100.0.2"
    volumes:
      - dkim-keys-strict:/etc/opendkim/keys
    dns: ["10.100.0.2"]
    depends_on:
      dns:
        condition: service_healthy
    networks: [dkim-net, dns-net]
    healthcheck:
      test: ["CMD", "/usr/bin/init", "--healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  # log: verify + stamp Authentication-Results header, never reject. Used to
  # prove that after an upgrade an admin sees the DKIM/DMARC verdict without
  # any legitimate mail being bounced.
  opendkim-log:
    build: ../../opendkim
    environment:
      DOMAINS:       "test.local other.local"
      AUTHSERV_ID:   "mail.test.local"
      DKIM_DMARC:    "log"
      NAMESERVERS:   "10.100.0.2"
    volumes:
      - dkim-keys-log:/etc/opendkim/keys
    dns: ["10.100.0.2"]
    depends_on:
      dns:
        condition: service_healthy
    networks: [dkim-net, dns-net]
    healthcheck:
      test: ["CMD", "/usr/bin/init", "--healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  opendmarc-log:
    build: ../../opendmarc
    environment:
      AUTHSERV_ID:   "mail.test.local"
      DKIM_DMARC:    "log"
      TRUSTED_HOSTS: "127.0.0.1 ::1"
      NAMESERVERS:   "10.100.0.2"
    dns: ["10.100.0.2"]
    depends_on:
      dns:
        condition: service_healthy
    networks: [dkim-net, dns-net]
    healthcheck:
      test: ["CMD", "/usr/bin/init", "--healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  postfix:
    build: ../../postfix
    hostname: postfix.test.local
    environment:
      GREYLIST:       postgrey
      OPENDKIM:       opendkim
      OPENDMARC:      opendmarc
      DOMAIN:         test.local
      HOSTNAME:       mail.test.local
      HOSTROOT:       test.local
      DB_HOST:        postfixadmin-db
      DB_USER:        postfixadmin
      DB_PASSWORD:    testpass
      DB_NAME:        postfixadmin
      DISABLE_DNSBL:  "yes"
      MYNETWORKS:     "127.0.0.0/8"
    dns: ["10.100.0.2"]
    depends_on:
      postfixadmin-db:
        condition: service_healthy
      opendkim:
        condition: service_healthy
      opendmarc:
        condition: service_healthy
      dns:
        condition: service_healthy
    networks: [mail, greylisting, db-net, dkim-net, dns-net]

  postfix-strict:
    build: ../../postfix
    hostname: postfix-strict.test.local
    environment:
      GREYLIST:       postgrey
      OPENDKIM:       opendkim-strict
      OPENDMARC:      opendmarc
      DOMAIN:         test.local
      HOSTNAME:       mail.test.local
      HOSTROOT:       test.local
      DB_HOST:        postfixadmin-db
      DB_USER:        postfixadmin
      DB_PASSWORD:    testpass
      DB_NAME:        postfixadmin
      DISABLE_DNSBL:  "yes"
      MYNETWORKS:     "127.0.0.0/8"
    dns: ["10.100.0.2"]
    depends_on:
      postfixadmin-db:
        condition: service_healthy
      opendkim-strict:
        condition: service_healthy
      opendmarc:
        condition: service_healthy
      dns:
        condition: service_healthy
    networks: [mail, greylisting, db-net, dkim-net, dns-net]

  postfix-log:
    build: ../../postfix
    hostname: postfix-log.test.local
    environment:
      GREYLIST:       postgrey
      OPENDKIM:       opendkim-log
      OPENDMARC:      opendmarc-log
      DOMAIN:         test.local
      HOSTNAME:       mail.test.local
      HOSTROOT:       test.local
      DB_HOST:        postfixadmin-db
      DB_USER:        postfixadmin
      DB_PASSWORD:    testpass
      DB_NAME:        postfixadmin
      DISABLE_DNSBL:  "yes"
      MYNETWORKS:     "127.0.0.0/8"
    dns: ["10.100.0.2"]
    depends_on:
      postfixadmin-db:
        condition: service_healthy
      opendkim-log:
        condition: service_healthy
      opendmarc-log:
        condition: service_healthy
      dns:
        condition: service_healthy
    networks: [mail, greylisting, db-net, dkim-net, dns-net]

  dovecot:
    build: ../../dovecot
    environment:
      DB_HOST:              postfixadmin-db
      DB_USER:              postfixadmin
      DB_PASSWORD:          testpass
      DB_NAME:              postfixadmin
      DOMAIN:               test.local
      # no DEFAULT_PASS_SCHEME → dovecot default SHA512-CRYPT, matching
      # PostfixAdmin's php_crypt ($6$…) hashes stored in the shared database
    volumes:
      - maildata:/var/mail/domains
    depends_on:
      postfixadmin-db:
        condition: service_healthy
    networks: [mail, db-net]

  postgrey:
    build: ../../postgrey
    command: ["-w", "5"]
    volumes:
      - ./greylist.conf:/etc/milter-greylist/greylist.conf:ro
    networks: [greylisting]
    dns_opt:
      - "timeout:1"
      - "attempts:1"
    healthcheck:
      test: ["CMD-SHELL", "nc -w2 127.0.0.1 10025 </dev/null"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 3s

  fake-smtp:
    build: ../../../fake-smtp
    volumes:
      - fake-mails:/mails
    networks: [mail]

  # Single shared database for PostfixAdmin, Postfix and Dovecot (mirrors the
  # production stack). Accounts are created through PostfixAdmin, not pre-seeded.
  postfixadmin-db:
    image: mariadb:11
    environment:
      MYSQL_DATABASE:             postfixadmin
      MYSQL_USER:                 postfixadmin
      MYSQL_PASSWORD:             testpass
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "postfixadmin", "-ptestpass"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [ui-net, db-net]

  postfixadmin:
    build: ../../postfixadmin
    environment:
      DATABASE_TYPE:          mysqli
      DATABASE_HOST:          postfixadmin-db
      DATABASE_NAME:          postfixadmin
      DATABASE_USER:          postfixadmin
      DATABASE_PASSWORD:      testpass
      SETUP_PASSWORD:              "$$2y$$12$$MHkqblkyo7WD0q6D3I7y9epJiZO9MqyN4AIYxmtn1NuyikRIvpDUy"
      EMAILCHECK_RESOLVE_DOMAIN:   "NO"
      ALIASES:                "10"
      MAILBOXES:              "10"
      MAXQUOTA:               "10"
      DOMAIN_QUOTA_DEFAULT:   "2048"
    depends_on:
      postfixadmin-db:
        condition: service_healthy
    networks: [ui-net]

  postfixadmin-proxy:
    build: ../../postfixadmin-proxy
    depends_on: [postfixadmin]
    networks: [ui-net]

  snappymail-init:
    image: mwaeckerlin/very-base
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mkdir -p /data/_data_/_default_/configs && printf '[security]\\nadmin_password = \"$$2y$$12$$wbso8NPeetgyrrwa5yKLBup0N011YwzKfyOYb0TCtsv/jX2q58nJi\"\\nadmin_login = \"admin\"\\n' > /data/_data_/_default_/configs/application.ini && chown -R 100 /data"
    volumes:
      - snappymail-data:/data
    networks: []

  snappymail:
    build:
      context: ../../rainloop
      dockerfile: Dockerfile.php-fpm
      target: php-fpm
    depends_on:
      snappymail-init:
        condition: service_completed_successfully
    volumes:
      - snappymail-data:/app/data
    networks: [ui-net, mail]

  snappymail-proxy:
    build:
      context: ../../rainloop
      dockerfile: Dockerfile.nginx
    depends_on: [snappymail]
    networks: [ui-net]

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    depends_on:
      postfix:
        condition: service_started
      postfix-strict:
        condition: service_started
      postfix-log:
        condition: service_started
      dovecot:
        condition: service_started
      postgrey:
        condition: service_healthy
      postfixadmin-proxy:
        condition: service_started
      snappymail-proxy:
        condition: service_started
    environment:
      POSTFIX_HOST:        postfix
      POSTFIX_STRICT_HOST: postfix-strict
      POSTFIX_LOG_HOST:    postfix-log
      DOVECOT_HOST:        dovecot
      OPENDKIM_HOST:       opendkim
      SMTP_PORT:           "25"
      IMAP_PORT:          "143"
      POP3_PORT:          "110"
      SIEVE_PORT:         "4190"
      OPENDKIM_PORT:      "10026"
      MAIL_DOMAIN:        test.local
      ALICE_USER:         alice@test.local
      ALICE_PASS:         alicepass12
      BOB_USER:           bob@test.local
      BOB_PASS:           bobpass12
      POSTFIXADMIN_URL:   "http://postfixadmin-proxy:8080"
      SNAPPYMAIL_URL:     "http://snappymail-proxy:8080"
      ADMIN_USER:         admin@test.local
      ADMIN_PASS:         Admin123pass
      SETUP_PASS:         test123
      SM_ADMIN_USER:      "admin"
      SM_ADMIN_PASS:      "12345"
    volumes:
      # read the dovecot maildir store to assert the on-disk mailbox layout
      - maildata:/var/mail/domains:ro
      # DKIM test key used by the verify tests to sign as external.local; the
      # matching public key is published in dns/dnsmasq.conf
      - ./testkeys:/testkeys:ro
    networks: [mail, ui-net]
    command: ["pytest", "-v", "--tb=short"]

networks:
  mail:
  greylisting:
  db-net:
  dkim-net:
  dns-net:
    ipam:
      config:
        - subnet: 10.100.0.0/24
  ui-net:

volumes:
  fake-mails:
  dkim-keys:
  dkim-keys-strict:
  dkim-keys-log:
  snappymail-data:
  maildata:
