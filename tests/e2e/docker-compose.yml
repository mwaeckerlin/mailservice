services:

  dns:
    build: ./dns
    networks:
      dns-net:
        ipv4_address: 10.100.0.2
    healthcheck:
      test: ["CMD-SHELL", "nc -w1 127.0.0.1 53 </dev/null"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 3s

  # Generate a throw-away self-signed TLS cert into the `letsencrypt`
  # volume at the path postfix/dovecot look for it
  # (/etc/letsencrypt/live/test.local/). This lets the e2e exercise the
  # real cert-present → TLS-enabled wiring (STARTTLS on 25, submission
  # auth over TLS, IMAPS on 993) that a plaintext stack cannot. Runs once.
  certs-init:
    image: alpine:3.23
    entrypoint: ["/bin/sh", "-c"]
    command:
      # apk pulls openssl over the network — retry so a transient
      # mirror hiccup never aborts the whole e2e run (the cert step
      # itself is offline and deterministic).
      - "i=0; while ! apk add --no-cache openssl >/dev/null 2>&1; do i=$$((i+1)); [ $$i -ge 15 ] && echo 'apk add openssl failed after 15 tries' && exit 1; sleep 3; done; mkdir -p /etc/letsencrypt/live/test.local && openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -keyout /etc/letsencrypt/live/test.local/privkey.pem -out /etc/letsencrypt/live/test.local/fullchain.pem -subj '/CN=mail.test.local' -addext 'subjectAltName=DNS:mail.test.local,DNS:test.local,DNS:postfix,DNS:postfix-strict,DNS:postfix-log,DNS:postfix-tlsreq,DNS:dovecot,DNS:dovecot-quota,DNS:dovecot-mark,DNS:dovecot-folder' && chmod 644 /etc/letsencrypt/live/test.local/*"
    volumes:
      - letsencrypt:/etc/letsencrypt

  # ────────────────────────────────────────────────────────────────────────
  # Antispam / antivirus backend — v3.0.0
  #
  # One rspamd instance per DKIM_DMARC mode (permissive / reject / log),
  # each with its own DKIM-key volume so signing tests are deterministic.
  # All three share one redis (Bayes / greylist / ratelimit) and one
  # clamav (virus signatures) — those are stateless per postfix.
  #
  # Retired in v3.0.0: opendkim, opendmarc, postgrey, postfix-policyd-
  # spf-perl. All of them collapse into rspamd.
  #
  # This is a TEST compose: it BUILDS the mailservice-own images
  # (postfix, dovecot, rspamd, clamav, postfixadmin, snappymail …) so
  # the suite also verifies that those images build correctly. Only
  # FOREIGN images from other repositories (mwaeckerlin/redis,
  # mwaeckerlin/fake-smtp) are pulled via `image:` — they are built and
  # tested in their own repositories.
  # ────────────────────────────────────────────────────────────────────────

  redis:
    image: mwaeckerlin/redis
    networks: [antispam]
    healthcheck:
      test: ["CMD", "/usr/bin/init", "--healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 3s

  clamav:
    build: ../../clamav
    volumes:
      # external cache volume (created by tests/run-e2e.sh): the
      # ~300 MB signature DB survives `down -v`, so only the very
      # first run pays the freshclam download.
      - clamav-db:/var/lib/clamav
    networks: [antispam]
    healthcheck:
      test: ["CMD", "/usr/bin/init", "--healthcheck"]
      # freshclam takes minutes on the first-ever start to bootstrap
      # the DB into the cache volume
      interval: 5s
      timeout: 5s
      retries: 240
      start_period: 10s

  # permissive: bad-sig / unknown-key / DMARC-p=reject-fail → 5xx.
  # Unsigned mail is accepted (Marc's philosophy: DKIM optional, must be
  # correct if published).
  rspamd:
    build: ../../rspamd
    environment:
      DOMAINS:                   "test.local other.local"
      AUTHSERV_ID:               "mail.test.local"
      DKIM_DMARC:                "permissive"
      REDIS_HOST:                "redis"
      CLAMAV_HOST:               "clamav"
      RSPAMD_REJECT_SCORE:       "15"
      # The test-runner lives on a 10.x docker network. Narrow
      # local_addrs to loopback so its mail counts as EXTERNAL (SPF/
      # DKIM/DMARC verify paths actually run), and allow-list 10/8 in
      # sign_networks so its unauthenticated submissions still get
      # DKIM-signed on the outbound path. Mirrors the v2 opendkim
      # trick of wide TRUSTED_HOSTS + narrow ExternalIgnoreList.
      RSPAMD_LOCAL_ADDRS:        "127.0.0.0/8"
      RSPAMD_SIGN_NETWORKS:      "10.0.0.0/8, 127.0.0.0/8"
      # Test-only: shorten greylist delay from the production 300s /
      # 35d — only mid-score mail is ever delayed (score-based
      # greylisting), but if it is, the retry must fit the pytest
      # budget.
      RSPAMD_GREYLIST_TIMEOUT:   "5s"
      RSPAMD_GREYLIST_EXPIRE:    "1h"
      # info-level logs make every learn/scan decision visible when
      # diagnosing a failed suite run
      RSPAMD_LOG_LEVEL:          "info"
    volumes:
      - dkim-keys:/var/lib/rspamd
    dns: ["10.100.0.2"]
    depends_on:
      dns:      { condition: service_healthy }
      redis:    { condition: service_healthy }
      clamav:   { condition: service_healthy }
    networks: [antispam, dns-net]
    healthcheck:
      test: ["CMD", "/usr/bin/init", "--healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  # reject: additionally rejects unsigned mail from external senders.
  rspamd-strict:
    build: ../../rspamd
    environment:
      DOMAINS:               "test.local other.local"
      AUTHSERV_ID:           "mail.test.local"
      DKIM_DMARC:            "reject"
      REDIS_HOST:            "redis"
      CLAMAV_HOST:           "clamav"
      RSPAMD_REJECT_SCORE:   "15"
      RSPAMD_LOCAL_ADDRS:    "127.0.0.0/8"
      RSPAMD_SIGN_NETWORKS:  "127.0.0.0/8"
    volumes:
      - dkim-keys-strict:/var/lib/rspamd
    dns: ["10.100.0.2"]
    depends_on:
      dns:    { condition: service_healthy }
      redis:  { condition: service_healthy }
      clamav: { condition: service_healthy }
    networks: [antispam, dns-net]
    healthcheck:
      test: ["CMD", "/usr/bin/init", "--healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  # log: verify + Authentication-Results stamping only, never reject.
  # Used to prove that after an upgrade an admin sees the DKIM/DMARC
  # verdict without any legitimate mail being bounced.
  # RSPAMD_BAYES_PER_USER is exercised on THIS instance (its Bayes is
  # otherwise unused — the autolearn tests train the main rspamd): the
  # per-user knob must produce per-recipient classifier state in redis.
  # See test_bayes_per_user.py.
  rspamd-log:
    build: ../../rspamd
    environment:
      DOMAINS:               "test.local other.local"
      AUTHSERV_ID:           "mail.test.local"
      DKIM_DMARC:            "log"
      REDIS_HOST:            "redis"
      CLAMAV_HOST:           "clamav"
      RSPAMD_REJECT_SCORE:   "15"
      RSPAMD_LOCAL_ADDRS:    "127.0.0.0/8"
      RSPAMD_SIGN_NETWORKS:  "127.0.0.0/8"
      RSPAMD_BAYES_PER_USER: "true"
    volumes:
      - dkim-keys-log:/var/lib/rspamd
    dns: ["10.100.0.2"]
    depends_on:
      dns:    { condition: service_healthy }
      redis:  { condition: service_healthy }
      clamav: { condition: service_healthy }
    networks: [antispam, dns-net]
    healthcheck:
      test: ["CMD", "/usr/bin/init", "--healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  # RSPAMD_CHECK_LOCAL=true + local_addrs covering the test-runner's
  # 10.x network: even a LOCAL client's doubtful mail is greylisted —
  # the opt-in that removes the local bypass. DKIM_DMARC=permissive so
  # the greylist module is active. See
  # test_greylisting.py::test_check_local_greylists_local_clients.
  rspamd-checklocal:
    build: ../../rspamd
    environment:
      DOMAINS:               "test.local"
      AUTHSERV_ID:           "mail.test.local"
      DKIM_DMARC:            "permissive"
      REDIS_HOST:            "redis"
      CLAMAV_HOST:           "clamav"
      RSPAMD_REJECT_SCORE:   "15"
      RSPAMD_LOCAL_ADDRS:    "10.0.0.0/8, 127.0.0.0/8"
      RSPAMD_SIGN_NETWORKS:  "10.0.0.0/8, 127.0.0.0/8"
      RSPAMD_CHECK_LOCAL:    "true"
      RSPAMD_GREYLIST_TIMEOUT: "5s"
      RSPAMD_GREYLIST_EXPIRE:  "1h"
    volumes:
      - dkim-keys-checklocal:/var/lib/rspamd
    dns: ["10.100.0.2"]
    depends_on:
      dns:    { condition: service_healthy }
      redis:  { condition: service_healthy }
      clamav: { condition: service_healthy }
    networks: [antispam, dns-net]
    healthcheck:
      test: ["CMD", "/usr/bin/init", "--healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  # One-shot-style helper for the DKIM-key NOTIFY feature: a fresh
  # rspamd (no key volume — keys regenerate on every start) that mails
  # the generated DNS records to fake-smtp (NOTIFY_SMTP must be a
  # numeric address — fake-smtp has the fixed 10.100.0.99). See
  # test_dkim_notify.py.
  rspamd-notify:
    build: ../../rspamd
    environment:
      DOMAIN:        "notify.local"
      DKIM_DMARC:    "off"
      REDIS_HOST:    "redis"
      CLAMAV_HOST:   "clamav"
      NOTIFY_EMAIL:  "hostmaster@extern.local"
      NOTIFY_SMTP:   "10.100.0.99:25"
    dns: ["10.100.0.2"]
    depends_on:
      dns:       { condition: service_healthy }
      redis:     { condition: service_healthy }
      clamav:    { condition: service_healthy }
      fake-smtp: { condition: service_started }
    networks: [antispam, dns-net]

  postfix:
    build: ../../postfix
    hostname: postfix.test.local
    environment:
      RSPAMD:         rspamd
      DOMAIN:         test.local
      HOSTNAME:       mail.test.local
      HOSTROOT:       test.local
      DB_HOST:        postfixadmin-db
      DB_USER:        postfixadmin
      DB_PASSWORD:    testpass
      DB_NAME:        postfixadmin
      DISABLE_DNSBL:  "yes"
      MYNETWORKS:     "127.0.0.0/8"
      # diagnostics override (production default is 0): TLS handshake
      # logs feed the per-service log tail run-e2e.sh prints on failure
      POSTFIX_TLS_LOGLEVEL: "2"
    dns: ["10.100.0.2"]
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      postfixadmin-db: { condition: service_healthy }
      rspamd:          { condition: service_healthy }
      dns:             { condition: service_healthy }
      certs-init:      { condition: service_completed_successfully }
    networks: [mail, antispam, db-net, dns-net]

  postfix-strict:
    build: ../../postfix
    hostname: postfix-strict.test.local
    environment:
      RSPAMD:         rspamd-strict
      DOMAIN:         test.local
      HOSTNAME:       mail.test.local
      HOSTROOT:       test.local
      DB_HOST:        postfixadmin-db
      DB_USER:        postfixadmin
      DB_PASSWORD:    testpass
      DB_NAME:        postfixadmin
      DISABLE_DNSBL:  "yes"
      MYNETWORKS:     "127.0.0.0/8"
      POSTFIX_TLS_LOGLEVEL: "2"
    dns: ["10.100.0.2"]
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      postfixadmin-db: { condition: service_healthy }
      rspamd-strict:   { condition: service_healthy }
      dns:             { condition: service_healthy }
      certs-init:      { condition: service_completed_successfully }
    networks: [mail, antispam, db-net, dns-net]

  postfix-log:
    build: ../../postfix
    hostname: postfix-log.test.local
    environment:
      RSPAMD:         rspamd-log
      DOMAIN:         test.local
      HOSTNAME:       mail.test.local
      HOSTROOT:       test.local
      DB_HOST:        postfixadmin-db
      DB_USER:        postfixadmin
      DB_PASSWORD:    testpass
      DB_NAME:        postfixadmin
      DISABLE_DNSBL:  "yes"
      MYNETWORKS:     "127.0.0.0/8"
      POSTFIX_TLS_LOGLEVEL: "2"
    dns: ["10.100.0.2"]
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      postfixadmin-db: { condition: service_healthy }
      rspamd-log:      { condition: service_healthy }
      dns:             { condition: service_healthy }
      certs-init:      { condition: service_completed_successfully }
    networks: [mail, antispam, db-net, dns-net]

  # MX wired to the check-local rspamd — the greylist opt-in that also
  # delays local clients. See test_greylisting.py.
  postfix-checklocal:
    build: ../../postfix
    hostname: postfix-checklocal.test.local
    environment:
      RSPAMD:         rspamd-checklocal
      DOMAIN:         test.local
      HOSTNAME:       mail.test.local
      HOSTROOT:       test.local
      DB_HOST:        postfixadmin-db
      DB_USER:        postfixadmin
      DB_PASSWORD:    testpass
      DB_NAME:        postfixadmin
      DISABLE_DNSBL:  "yes"
      MYNETWORKS:     "127.0.0.0/8"
    dns: ["10.100.0.2"]
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      postfixadmin-db:   { condition: service_healthy }
      rspamd-checklocal: { condition: service_healthy }
      dns:               { condition: service_healthy }
      certs-init:        { condition: service_completed_successfully }
    networks: [mail, antispam, db-net, dns-net]

  # No TLS certificate on purpose: pins the no-cert secure default of
  # the postfix image — SASL must be disabled entirely (stack invariant:
  # passwords never travel unencrypted; same behaviour as dovecot, where
  # a stack without a certificate has no usable login). See
  # test_tls.py::test_smtp_auth_disabled_without_cert.
  postfix-nocert:
    build: ../../postfix
    hostname: postfix-nocert.test.local
    environment:
      DOMAIN:         test.local
      HOSTNAME:       mail.test.local
      HOSTROOT:       test.local
      DB_HOST:        postfixadmin-db
      DB_USER:        postfixadmin
      DB_PASSWORD:    testpass
      DB_NAME:        postfixadmin
      DISABLE_DNSBL:  "yes"
      MYNETWORKS:     "127.0.0.0/8"
    depends_on:
      postfixadmin-db: { condition: service_healthy }
      dovecot:         { condition: service_started }
    networks: [mail, db-net]

  # POSTFIX_ALLOW_CLEARTEXT_AUTH=yes on the certless image: the
  # documented deliberate softening — SASL is then offered and works
  # without TLS (the secure default on postfix-nocert refuses it).
  # See test_tls.py::test_cleartext_auth_optin_smtp.
  postfix-nocert-clear:
    build: ../../postfix
    hostname: postfix-nocert-clear.test.local
    environment:
      DOMAIN:         test.local
      HOSTNAME:       mail.test.local
      HOSTROOT:       test.local
      DB_HOST:        postfixadmin-db
      DB_USER:        postfixadmin
      DB_PASSWORD:    testpass
      DB_NAME:        postfixadmin
      DISABLE_DNSBL:  "yes"
      MYNETWORKS:     "127.0.0.0/8"
      POSTFIX_ALLOW_CLEARTEXT_AUTH: "yes"
    depends_on:
      postfixadmin-db: { condition: service_healthy }
      dovecot:         { condition: service_started }
    networks: [mail, db-net]

  # SMTPD_TLS_REQUIRED=yes: the MX (port 25) must reject any connection
  # that will not negotiate TLS. Has a certificate (so TLS is possible);
  # pins the opt-in reject mode. See test_tls.py::test_tls_required_*.
  postfix-tlsreq:
    build: ../../postfix
    hostname: postfix-tlsreq.test.local
    environment:
      RSPAMD:              rspamd
      DOMAIN:              test.local
      HOSTNAME:            mail.test.local
      HOSTROOT:            test.local
      DB_HOST:             postfixadmin-db
      DB_USER:             postfixadmin
      DB_PASSWORD:         testpass
      DB_NAME:             postfixadmin
      DISABLE_DNSBL:       "yes"
      MYNETWORKS:          "127.0.0.0/8"
      SMTPD_TLS_REQUIRED:  "yes"
    dns: ["10.100.0.2"]
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      postfixadmin-db: { condition: service_healthy }
      rspamd:          { condition: service_healthy }
      dns:             { condition: service_healthy }
      certs-init:      { condition: service_completed_successfully }
    networks: [mail, antispam, db-net, dns-net]

  dovecot:
    build: ../../dovecot
    environment:
      DB_HOST:              postfixadmin-db
      DB_USER:              postfixadmin
      DB_PASSWORD:          testpass
      DB_NAME:              postfixadmin
      DOMAIN:               test.local
      # diagnostics override (production default is no): auth debug lines
      # feed the per-service log tail that run-e2e.sh prints on failure
      DOVECOT_DEBUG_AUTH:   "yes"
      # no DEFAULT_PASS_SCHEME → dovecot default SHA512-CRYPT, matching
      # PostfixAdmin's php_crypt ($6$…) hashes stored in the shared database
    volumes:
      - maildata:/var/mail/domains
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      postfixadmin-db: { condition: service_healthy }
      rspamd:          { condition: service_healthy }
      certs-init:      { condition: service_completed_successfully }
    networks: [mail, antispam, db-net]

  # DOVECOT_QUOTA=yes: per-mailbox quota from the PostfixAdmin
  # mailbox.quota column (sql userdb). Own maildata so quota accounting
  # is isolated from the main dovecot. Pins that (a) the sql userdb
  # authenticates, (b) enforcement blocks an over-quota IMAP append and
  # (c) an over-quota LMTP delivery tempfails (the production path).
  # See test_quota.py.
  dovecot-quota:
    build: ../../dovecot
    environment:
      DB_HOST:              postfixadmin-db
      DB_USER:              postfixadmin
      DB_PASSWORD:          testpass
      DB_NAME:              postfixadmin
      DOMAIN:               test.local
      DOVECOT_QUOTA:        "yes"
      DOVECOT_DEBUG_AUTH:   "yes"
    volumes:
      - maildata-quota:/var/mail/domains
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      postfixadmin-db: { condition: service_healthy }
      rspamd:          { condition: service_healthy }
      certs-init:      { condition: service_completed_successfully }
    networks: [mail, antispam, db-net]

  # SPAM_DELIVERY_MODE=mark: borderline spam (X-Spam-Flag: YES, accepted
  # at SMTP time) is delivered to INBOX with the informational headers —
  # never to Junk, never a rewritten subject. Own maildata so folder
  # assertions are isolated. SIEVE_MAX_SCRIPT_SIZE is lowered to a
  # testable value here to pin the knob's EFFECTIVENESS (an oversized
  # ManageSieve upload must be refused), not just its validation.
  # See test_delivery_mode.py / test_sieve.py.
  dovecot-mark:
    build: ../../dovecot
    environment:
      DB_HOST:                postfixadmin-db
      DB_USER:                postfixadmin
      DB_PASSWORD:            testpass
      DB_NAME:                postfixadmin
      DOMAIN:                 test.local
      SPAM_DELIVERY_MODE:     mark
      SIEVE_MAX_SCRIPT_SIZE:  1k
      DOVECOT_DEBUG_AUTH:     "yes"
    volumes:
      - maildata-mark:/var/mail/domains
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      postfixadmin-db: { condition: service_healthy }
      rspamd:          { condition: service_healthy }
      certs-init:      { condition: service_completed_successfully }
    networks: [mail, antispam, db-net]

  # DOVECOT_ALLOW_CLEARTEXT=yes on a CERTLESS stack: the documented
  # deliberate softening for trusted, isolated networks without
  # certificates — cleartext IMAP/POP3 logins must then work (the
  # default `no` on the certless path means «no usable login at all»,
  # pinned on the main dovecot). No letsencrypt volume on purpose.
  # See test_tls.py::test_cleartext_optin_*.
  dovecot-cleartext:
    build: ../../dovecot
    environment:
      DB_HOST:                  postfixadmin-db
      DB_USER:                  postfixadmin
      DB_PASSWORD:              testpass
      DB_NAME:                  postfixadmin
      DOMAIN:                   test.local
      DOVECOT_ALLOW_CLEARTEXT:  "yes"
      DOVECOT_DEBUG_AUTH:       "yes"
    volumes:
      - maildata-cleartext:/var/mail/domains
    depends_on:
      postfixadmin-db: { condition: service_healthy }
    networks: [mail, db-net]

  # DEFAULT_PASS_SCHEME=PLAIN on its own instance (a shared one would
  # break the crypt-hashed regular accounts): the legacy-migration
  # scenario — an imported database row with a bare PLAIN password must
  # authenticate. Cleartext login allowed so the test can log in
  # directly. See test_imap.py::test_default_pass_scheme_effective.
  dovecot-passscheme:
    build: ../../dovecot
    environment:
      DB_HOST:                  postfixadmin-db
      DB_USER:                  postfixadmin
      DB_PASSWORD:              testpass
      DB_NAME:                  postfixadmin
      DOMAIN:                   test.local
      DOVECOT_ALLOW_CLEARTEXT:  "yes"
      DOVECOT_DEBUG_AUTH:       "yes"
      DEFAULT_PASS_SCHEME:      "PLAIN"
    volumes:
      - maildata-passscheme:/var/mail/domains
    depends_on:
      postfixadmin-db: { condition: service_healthy }
    networks: [mail, db-net]

  # SPAM_DELIVERY_MODE=folder: mail carrying X-Spam-Flag: YES is routed
  # to the recipient's Junk folder by the server-side sieve_before rule
  # (silent quarantine — the documented, not-recommended opt-in). Own
  # maildata so folder assertions are isolated. See test_delivery_mode.py.
  dovecot-folder:
    build: ../../dovecot
    environment:
      DB_HOST:              postfixadmin-db
      DB_USER:              postfixadmin
      DB_PASSWORD:          testpass
      DB_NAME:              postfixadmin
      DOMAIN:               test.local
      SPAM_DELIVERY_MODE:   folder
      DOVECOT_DEBUG_AUTH:   "yes"
    volumes:
      - maildata-folder:/var/mail/domains
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      postfixadmin-db: { condition: service_healthy }
      rspamd:          { condition: service_healthy }
      certs-init:      { condition: service_completed_successfully }
    networks: [mail, antispam, db-net]

  # foreign image — built and tested in its own repository. The fixed
  # dns-net address makes it the MX target of extern.local (see
  # dns/dnsmasq.conf), so the mailforward e2e can assert a real
  # virtual-alias forward: mailforward → MX lookup → fake-smtp.
  fake-smtp:
    image: mwaeckerlin/fake-smtp
    volumes:
      - fake-mails:/mails
    networks:
      mail:
      dns-net:
        # high in the /24 so it can never collide with the dynamic
        # addresses docker hands out to the other dns-net services
        ipv4_address: 10.100.0.99

  # ────────────────────────────────────────────────────────────────────────
  # Relay family — the generic postfix images the mailservice postfix
  # builds on (smtp-relay → mailforward → postfix, smtp-relay →
  # smtp-relay-tls). All are mailservice submodules, so this TEST compose
  # may build them via `../../<name>` (project-internal). The tests pin
  # the behavioural invariants (banner, EHLO, STARTTLS, virtual-alias
  # forwarding) that the headless migration must preserve.
  # ────────────────────────────────────────────────────────────────────────

  smtp-relay:
    build: ../../smtp-relay
    environment:
      # the isolated e2e resolver cannot answer the RBL zones — every
      # lookup would stall the SMTP dialogue until the resolver timeout
      DISABLE_DNSBL: "yes"
      # generic milter hook (historical name from the opendkim era):
      # wire the relay to the rspamd milter and prove the hook is
      # EFFECTIVE — the relayed mail must carry rspamd's headers.
      # See test_relay_family.py::test_smtp_relay_milter_hook_effective.
      OPENDKIM: "rspamd:11332"
    # the isolated resolver lets the relay do a REAL MX lookup for
    # extern.local and deliver to fake-smtp — pinning the image's core
    # purpose (accept + relay), not just banner/EHLO. See
    # test_relay_family.py::test_smtp_relay_relays_to_external_mx.
    dns: ["10.100.0.2"]
    depends_on:
      dns:       { condition: service_healthy }
      fake-smtp: { condition: service_started }
      rspamd:    { condition: service_healthy }
    networks: [mail, dns-net, antispam]

  smtp-relay-tls:
    build: ../../smtp-relay-tls
    environment:
      MAILHOST: test.local        # cert path under /etc/letsencrypt/live/
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      certs-init: { condition: service_completed_successfully }
    networks: [mail]

  mailforward:
    build: ../../mailforward
    environment:
      MAILHOST: fwd.local
      # forward@fwd.local is forwarded to sink@extern.local, whose MX
      # (dns/dnsmasq.conf) points at fake-smtp — a real end-to-end
      # forward the test asserts by reading fake-smtp's mail store.
      MAPPINGS: "forward@fwd.local sink@extern.local"
      # the isolated e2e resolver cannot answer the RBL zones — every
      # lookup would stall the SMTP dialogue until the resolver timeout
      DISABLE_DNSBL: "yes"
      # generic milter hook (historical name from the milter-greylist
      # era) — wired to rspamd and proven effective by
      # test_relay_family.py::test_mailforward_milter_hook_effective.
      GREYLIST: "rspamd:11332"
    dns: ["10.100.0.2"]
    depends_on:
      dns:       { condition: service_healthy }
      fake-smtp: { condition: service_started }
      rspamd:    { condition: service_healthy }
    networks: [mail, dns-net, antispam]

  # Single shared database for PostfixAdmin, Postfix and Dovecot (mirrors the
  # production stack). Accounts are created through PostfixAdmin, not pre-seeded.
  postfixadmin-db:
    image: mariadb:11
    environment:
      MYSQL_DATABASE:             postfixadmin
      MYSQL_USER:                 postfixadmin
      MYSQL_PASSWORD:             testpass
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "postfixadmin", "-ptestpass"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [ui-net, db-net]

  postfixadmin:
    build: ../../postfixadmin
    environment:
      DATABASE_TYPE:          mysqli
      DATABASE_HOST:          postfixadmin-db
      DATABASE_NAME:          postfixadmin
      DATABASE_USER:          postfixadmin
      DATABASE_PASSWORD:      testpass
      SETUP_PASSWORD:              "$$2y$$12$$MHkqblkyo7WD0q6D3I7y9epJiZO9MqyN4AIYxmtn1NuyikRIvpDUy"
      EMAILCHECK_RESOLVE_DOMAIN:   "NO"
      ALIASES:                "10"
      MAILBOXES:              "10"
      MAXQUOTA:               "10"
      DOMAIN_QUOTA_DEFAULT:   "2048"
      # branding knobs — rendered into the UI, pinned by
      # test_webui.py::test_postfixadmin_branding_rendered
      FOOTER_TEXT:            "E2E Footer Contract"
      FOOTER_LINK:            "https://example.test/footer"
      # default role aliases need a target (ADDRESS or DOMAIN), else
      # the list stays empty — pinned by
      # test_webui.py::test_postfixadmin_default_aliases_created
      DEFAULT_ALIASES_ADDRESS: "alice@test.local"
    depends_on:
      postfixadmin-db: { condition: service_healthy }
    networks: [ui-net]

  postfixadmin-proxy:
    build: ../../postfixadmin-proxy
    depends_on: [postfixadmin]
    networks: [ui-net]

  # ── Schema-upgrade e2e (README «Database schema upgrade after an
  # image update») — a REAL old schema (PostfixAdmin 3.2.4, generated by
  # the old release's own upgrade chain, never a hand-written fixture)
  # in a dedicated database; the CURRENT image runs on top of it and the
  # documented trigger (setup.php) must migrate the schema.
  # See test_schema_upgrade.py.
  postfixadmin-db-upgrade:
    image: mariadb:11
    environment:
      MYSQL_DATABASE:             postfixadmin
      MYSQL_USER:                 postfixadmin
      MYSQL_PASSWORD:             testpass
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "postfixadmin", "-ptestpass"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [ui-net]

  postfixadmin-old-init:
    build: ./postfixadmin-old
    depends_on:
      postfixadmin-db-upgrade: { condition: service_healthy }
    networks: [ui-net]

  postfixadmin-upgrade:
    build: ../../postfixadmin
    environment:
      DATABASE_TYPE:          mysqli
      DATABASE_HOST:          postfixadmin-db-upgrade
      DATABASE_NAME:          postfixadmin
      DATABASE_USER:          postfixadmin
      DATABASE_PASSWORD:      testpass
      SETUP_PASSWORD:              "$$2y$$12$$MHkqblkyo7WD0q6D3I7y9epJiZO9MqyN4AIYxmtn1NuyikRIvpDUy"
      EMAILCHECK_RESOLVE_DOMAIN:   "NO"
    depends_on:
      postfixadmin-old-init: { condition: service_completed_successfully }
    networks: [ui-net]

  postfixadmin-upgrade-proxy:
    build: ../../postfixadmin-proxy
    environment:
      PHP_FPM_HOST: postfixadmin-upgrade
    depends_on: [postfixadmin-upgrade]
    networks: [ui-net]

  snappymail-init:
    # very-base + the bundled transport-security plugin + install script
    build:
      context: ../../rainloop
      dockerfile: Dockerfile.plugin-init
    entrypoint: ["/bin/sh", "-c"]
    environment:
      SNAPPYMAIL_DATA: /data
    command:
      # [security] openpgp = On makes the OpenPGP settings pane and the
      # compose sign/encrypt controls available — exercised by
      # test_openpgp.py against the shipped php-gnupg backend.
      - "mkdir -p /data/_data_/_default_/configs && printf '[security]\\nadmin_password = \"$$2y$$12$$wbso8NPeetgyrrwa5yKLBup0N011YwzKfyOYb0TCtsv/jX2q58nJi\"\\nadmin_login = \"admin\"\\nopenpgp = On\\n' > /data/_data_/_default_/configs/application.ini && /usr/local/bin/install-plugins.sh"
    volumes:
      - snappymail-data:/data
    networks: []

  # Built with SKIP_GPG_VERIFY=1: this repo ships a placeholder signing
  # key on purpose; the strict verification machinery itself is covered
  # by test_snappymail_gpg_verify.py.
  snappymail:
    build:
      context: ../../rainloop
      dockerfile: Dockerfile.php-fpm
      target: php-fpm
      args:
        SKIP_GPG_VERIFY: "1"
    depends_on:
      snappymail-init: { condition: service_completed_successfully }
    volumes:
      - snappymail-data:/app/data
    networks: [ui-net, mail]

  snappymail-proxy:
    build:
      context: ../../rainloop
      dockerfile: Dockerfile.nginx
      args:
        # this repo ships a placeholder signing key on purpose — same
        # escape hatch as the snappymail (php-fpm) build above
        SKIP_GPG_VERIFY: "1"
    depends_on: [snappymail]
    networks: [ui-net]

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    depends_on:
      postfix:            { condition: service_started }
      postfix-strict:     { condition: service_started }
      postfix-log:        { condition: service_started }
      postfix-nocert:     { condition: service_started }
      postfix-nocert-clear: { condition: service_started }
      postfix-checklocal: { condition: service_started }
      rspamd-notify:      { condition: service_started }
      dovecot:            { condition: service_started }
      dovecot-mark:       { condition: service_started }
      dovecot-folder:     { condition: service_started }
      dovecot-cleartext:  { condition: service_started }
      dovecot-passscheme: { condition: service_started }
      postfixadmin-proxy: { condition: service_started }
      postfixadmin-upgrade-proxy: { condition: service_started }
      snappymail-proxy:   { condition: service_started }
      smtp-relay:         { condition: service_started }
      smtp-relay-tls:     { condition: service_started }
      mailforward:        { condition: service_started }
    environment:
      POSTFIX_HOST:        postfix
      POSTFIX_STRICT_HOST: postfix-strict
      POSTFIX_LOG_HOST:    postfix-log
      POSTFIX_NOCERT_HOST: postfix-nocert
      POSTFIX_NOCERT_CLEAR_HOST: postfix-nocert-clear
      POSTFIX_CHECKLOCAL_HOST: postfix-checklocal
      RSPAMD_LOG_CTL_URL: "http://rspamd-log:11334"
      DOVECOT_HOST:        dovecot
      DOVECOT_MARK_HOST:   dovecot-mark
      DOVECOT_FOLDER_HOST: dovecot-folder
      DOVECOT_CLEARTEXT_HOST: dovecot-cleartext
      DOVECOT_PASSSCHEME_HOST: dovecot-passscheme
      RSPAMD_HOST:         rspamd
      RSPAMD_STRICT_HOST:  rspamd-strict
      RSPAMD_LOG_HOST:     rspamd-log
      SMTP_PORT:          "25"
      IMAP_PORT:          "143"
      POP3_PORT:          "110"
      SIEVE_PORT:         "4190"
      RSPAMD_PORT:        "11332"
      RSPAMD_CTL_PORT:    "11334"
      MAIL_DOMAIN:        test.local
      ALICE_USER:         alice@test.local
      ALICE_PASS:         alicepass12
      BOB_USER:           bob@test.local
      BOB_PASS:           bobpass12
      POSTFIXADMIN_URL:   "http://postfixadmin-proxy:8080"
      POSTFIXADMIN_UPGRADE_URL: "http://postfixadmin-upgrade-proxy:8080"
      PA_UPGRADE_DB_HOST: postfixadmin-db-upgrade
      SNAPPYMAIL_URL:     "http://snappymail-proxy:8080"
      ADMIN_USER:         admin@test.local
      ADMIN_PASS:         Admin123pass
      SETUP_PASS:         test123
      SM_ADMIN_USER:      "admin"
      SM_ADMIN_PASS:      "12345"
      SMTP_RELAY_HOST:     smtp-relay
      SMTP_RELAY_TLS_HOST: smtp-relay-tls
      MAILFORWARD_HOST:    mailforward
      FWD_ADDRESS:         forward@fwd.local
      FWD_UNMAPPED:        nobody@fwd.local
      FAKE_MAILS_DIR:      /fake-mails
    volumes:
      # read the dovecot maildir store to assert the on-disk mailbox layout
      - maildata:/var/mail/domains:ro
      # read fake-smtp's mail store to assert the mailforward forward
      - fake-mails:/fake-mails:ro
      # DKIM test key used by the verify tests to sign as external.local; the
      # matching public key is published in dns/dnsmasq.conf
      - ./testkeys:/testkeys:ro
    networks: [mail, ui-net, antispam]
    command: ["pytest", "-v", "--tb=short"]

networks:
  mail:
  db-net:
  antispam:
  dns-net:
    ipam:
      config:
        - subnet: 10.100.0.0/24
  ui-net:

volumes:
  fake-mails:
  dkim-keys:
  dkim-keys-strict:
  dkim-keys-log:
  dkim-keys-checklocal:
  clamav-db:
    # survives `docker compose down -v` — tests/run-e2e.sh creates it
    # once; delete manually (docker volume rm mailservice-e2e-clamav-db)
    # to reclaim the ~300 MB signature cache.
    name: mailservice-e2e-clamav-db
    external: true
  snappymail-data:
  maildata:
  maildata-quota:
  maildata-mark:
  maildata-folder:
  maildata-cleartext:
  maildata-passscheme:
  letsencrypt:
