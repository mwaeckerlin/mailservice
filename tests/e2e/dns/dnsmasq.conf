no-resolv
no-hosts
# Authoritative for test.local: unknown records get NXDOMAIN not REFUSED
local=/test.local/
# A record + wildcard for all subdomains (satisfies reject_unknown_recipient_domain)
address=/.test.local/10.1.1.1
# MX
mx-host=test.local,mail.test.local,10
# SPF: authorize private Docker subnets; ~all = softfail for others
txt-record=test.local,v=spf1 ip4:10.0.0.0/8 ip4:172.16.0.0/12 ip4:192.168.0.0/16 ~all

# ---- other.local: second signing domain used by multi-domain sign tests ---
# The opendkim instances are started with DOMAINS="test.local other.local", so
# mail with From: @other.local must be signed with the other.local key.
local=/other.local/
address=/.other.local/10.1.1.3
mx-host=other.local,mail.other.local,10
txt-record=other.local,v=spf1 ip4:10.0.0.0/8 ip4:172.16.0.0/12 ip4:192.168.0.0/16 ~all

# ---- external.local: simulated remote sender used by DKIM-verify tests ----
# test-runner signs (or intentionally does not sign) messages FROM
# @external.local and delivers them to postfix so we can assert
# opendkim's verify behavior. Private key lives at
# tests/e2e/testkeys/external.local.mail.key (committed — TEST key only).
local=/external.local/
address=/.external.local/10.1.1.2
mx-host=external.local,mail.external.local,10
txt-record=external.local,v=spf1 ip4:10.0.0.0/8 ip4:172.16.0.0/12 ip4:192.168.0.0/16 ~all
txt-record=mail._domainkey.external.local,v=DKIM1; h=sha256; k=rsa; 

# ---- dmarc-none.local: sender publishes `_dmarc … p=none` -----------------
# Used by test_dmarc.py: DMARC record exists but policy is «monitor only»;
# unsigned mail must be accepted (opendmarc must not reject on p=none).
local=/dmarc-none.local/
host-record=dmarc-none.local,10.1.1.7
host-record=mail.dmarc-none.local,10.1.1.7
mx-host=dmarc-none.local,mail.dmarc-none.local,10
txt-record=dmarc-none.local,v=spf1 ip4:10.0.0.0/8 ip4:172.16.0.0/12 ip4:192.168.0.0/16 ~all
txt-record=_dmarc.dmarc-none.local,v=DMARC1; p=none

# ---- nodkim.local: no DKIM key in DNS (used for On-KeyNotFound test) -----
# host-record instead of address= so subdomains return NXDOMAIN cleanly —
# needed because opendkim treats NODATA (name-exists-but-no-TXT, which is
# what dnsmasq's wildcard would produce) differently from NXDOMAIN.
local=/nodkim.local/
host-record=nodkim.local,10.1.1.6
host-record=mail.nodkim.local,10.1.1.6
mx-host=nodkim.local,mail.nodkim.local,10
txt-record=nodkim.local,v=spf1 ip4:10.0.0.0/8 ip4:172.16.0.0/12 ip4:192.168.0.0/16 ~all

# ---- dmarc-strict.local: sender publishes p=reject, SPF -all -------------
# Used by test_dmarc.py: mail from @dmarc-strict.local must be signed AND
# DKIM-aligned to be accepted. SPF authorises no one (-all), so the only
# way a mail from this domain passes is a valid DKIM signature. Same test
# key as external.local.
local=/dmarc-strict.local/
address=/.dmarc-strict.local/10.1.1.4
mx-host=dmarc-strict.local,mail.dmarc-strict.local,10
txt-record=dmarc-strict.local,v=spf1 ~all
txt-record=_dmarc.dmarc-strict.local,v=DMARC1; p=reject; adkim=r; aspf=r
txt-record=mail._domainkey.dmarc-strict.local,v=DKIM1; h=sha256; k=rsa; 
