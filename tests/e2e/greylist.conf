pidfile "/var/run/milter-greylist/milter-greylist.pid"
dumpfile "/var/lib/milter-greylist/greylist.db" 600
dumpfreq 1
user "smmsp"
verbose
stat "|cat" "%T{%Y/%m/%d %T} %d [%i] %f -> %r %S (ACL %A) %Xc %Xe %Xm"
greylist 5s
autowhite 1d

# SASL-authenticated submissions must never be greylisted (mirrors production)
racl whitelist auth /.*/

racl whitelist from sender@test.local
racl whitelist from alice@test.local
racl whitelist from bob@test.local

# Senders used by the DKIM multi-domain sign / verify tests. Whitelisted so
# the tests are not delayed by greylist tempfails (which would otherwise
# cause postfix's smtpd_hard_error_limit to trip with «421 too many errors»
# as the tests connect repeatedly). Literal addresses only — milter-greylist
# regex support for `from` is unreliable.
racl whitelist from otheralice@other.local
racl whitelist from dkimregress@test.local
racl whitelist from remote@external.local
racl whitelist from strict@dmarc-strict.local
racl whitelist from nokey@nodkim.local
racl whitelist from plain@nodkim.local
racl whitelist from monitor@dmarc-none.local
