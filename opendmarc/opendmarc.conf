Syslog                 yes
Socket                 inet:8893@0.0.0.0
PidFile                /run/opendmarc/opendmarc.pid
BaseDirectory          /run/opendmarc
HistoryFile            /run/opendmarc/opendmarc.dat
UMask                  007

# RejectFailures and SoftwareHeader are written from the DKIM_DMARC env
# at start-up (off/log = don't reject, reject/permissive = reject on
# p=reject hard fail).
FailureReports         false

# opendmarc runs its own SPF check via libspf2 (postfix-policyd-spf-perl
# writes Received-SPF but not an Authentication-Results header that
# opendmarc parses). SPFIgnoreResults=true keeps opendmarc from being
# confused by any downstream A-R spf= result. SPFSelfValidate is
# effectively required for log/permissive/reject and no-op for off.
SPFSelfValidate        true
SPFIgnoreResults       true

# Skip processing for connections from these hosts (loopback + internal
# container networks). Own users / internal services stay unaffected.
IgnoreHosts            /etc/opendmarc/ignore.hosts

# AuthservID and TrustedAuthservIDs are filled in at start-up by init.cpp
# from AUTHSERV_ID (default: mail.local); opendkim must set AuthservID to
# the same value so opendmarc trusts its dkim= result.

# Nameservers is filled in at start-up from NAMESERVERS env if set — used
# to bypass the container's default resolver when it rewrites authoritative
# NXDOMAIN into SERVFAIL (e.g. Docker's embedded resolver on 127.0.0.11).

