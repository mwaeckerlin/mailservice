services:
  postfixadmin-proxy:
    image: mwaeckerlin/postfixadmin-proxy
    build: postfixadmin-proxy
    ports:
      # loopback only: the admin UI speaks plain HTTP (setup and login
      # passwords would travel unencrypted) — put a TLS reverse proxy
      # (e.g. mwaeckerlin/reverse-proxy) in front for remote access.
      # See README «Trade-off — admin UI without TLS».
      - "127.0.0.1:8080:8080"
    networks:
      - postfixadmin-frontend

  postfixadmin:
    image: mwaeckerlin/postfixadmin
    build: postfixadmin
    environment:
      # setup password is: test123
      # set to anything else to generate a different one, e.g. empty
      SETUP_PASSWORD: 0310f894fb05ed0cf05de3d61abc0ced:c56c4bc25f893e52f6e806a907e30e59edb6e120
      DATABASE_PASSWORD: eepaiph3ohquai2Eilae-change-it
      DEFAULT_ALIASES_ADDRESS: info
      #DEFAULT_ALIASES_DOMAIN: merkur.mrw.sh
      FOOTER_TEXT: "Mailservice Project"
      FOOTER_LINK: "https://github.com/mwaeckerlin/mailservice"
      WELCOME_TEXT: |
        Hi,

        Welcome to your new mail account!
      SHOW_CUSTOM_DOMAINS: "merkur.mrw.sh localhost"
      SHOW_CUSTOM_COLORS: "green red"
    networks:
      postfixadmin-frontend:
        aliases:
          - merkur.mrw.sh
          - merkur
          - demo
          - test
          - lokal
          - extern
      postfixadmin-backend:


  postfixadmin-db:
    # mariadb 11+ is a stack requirement (dovecot 2.4 TLS, see README)
    # and matches the e2e stack; a rolling `mysql` image additionally
    # breaks on 8.4 where --default-authentication-plugin was removed.
    # Foreign image on purpose: no hardened mwaeckerlin/ database image
    # exists (documented exception, see README).
    image: mariadb:11
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: postfixadmin
      MYSQL_USER: postfixadmin
      MYSQL_PASSWORD: eepaiph3ohquai2Eilae-change-it
    volumes:
      # /var/lib/mysql is where mariadb stores its data — a volume on
      # any other path silently persists nothing (all accounts and
      # password hashes gone on every recreate)
      - type: volume
        source: postfixadmin-db
        target: /var/lib/mysql
    networks:
      - postfixadmin-backend
      - postfix-backend

  # ───────────────────────────────────────────────────────────────────
  # Antispam / Antivirus (v3.0.0)
  #
  # One rspamd container handles DKIM signing, DKIM verify, DMARC, SPF,
  # greylist, Bayes-based spam scoring and (via clamav) virus scanning.
  # Retired in v3.0.0: opendkim, opendmarc, postgrey, postfix-policyd-
  # spf-perl — rspamd covers all of them, in one config, with one log
  # stream. See README «Antispam/Antivirus architecture» for the
  # rationale and the v2 → v3 migration path.
  # ───────────────────────────────────────────────────────────────────

  redis:
    # `mwaeckerlin/redis` is a generic image with its own repository —
    # built and tested there, never from this compose file. A locally
    # built image takes precedence; otherwise Docker pulls it from the
    # hub automatically.
    image: mwaeckerlin/redis
    volumes:
      - type: volume
        source: redis-data      # Bayes / greylist / ratelimit state
        target: /data
    networks:
      - antispam

  clamav:
    image: mwaeckerlin/clamav
    build: clamav
    volumes:
      - type: volume
        source: clamav-db        # virus signatures (~200 MB, freshclam)
        target: /var/lib/clamav
    networks:
      - antispam

  rspamd:
    image: mwaeckerlin/rspamd
    build: rspamd
    environment:
      DOMAIN: mrw.sh
      # AUTHSERV_ID: your.domain
      # DKIM_DMARC — single knob controlling DKIM signing + DKIM verify
      # + DMARC + greylist enforcement, one of:
      #   off         verify off entirely, milter passes everything
      #   log         verify + stamp Authentication-Results, NEVER
      #               reject. Run for a few days after enabling in
      #               production; grep delivered mail's A-R header
      #               for `dkim=fail`, `dkim=permerror`, `dmarc=fail`
      #               before escalating.
      #   permissive  reject bad DKIM / unknown-key / DMARC-p=reject
      #               fail; accept unsigned (Marc's philosophy: DKIM
      #               is optional but must be correct if published).
      #   reject      also reject unsigned mail. Only right when
      #               every legitimate sender is known to sign.
      # Image default is `reject` (strict). Start at `log` on a fresh
      # upgrade and escalate — see README «Upgrade & Monitoring».
      DKIM_DMARC: log
      # Spam-score threshold. Rspamd's own default (15) — conservative
      # on purpose: better a slightly-too-high reject threshold than
      # legitimate mail bounced.
      RSPAMD_REJECT_SCORE: "15"
      REDIS_HOST: redis
      CLAMAV_HOST: clamav
      # Optional: send an operator mail whenever a new DKIM key is
      # generated on start-up (init.cpp speaks a minimal in-process
      # SMTP dialogue). Empty = only stdout log. NOTIFY_SMTP must be a
      # NUMERIC IPv4 address — the init helper does no DNS lookup, so
      # a service name like "postfix:25" does not work (give the
      # postfix service a fixed address if you need this).
      # NOTIFY_EMAIL: "hostmaster@mrw.sh"
      # NOTIFY_SMTP:  "127.0.0.1:25"
    volumes:
      - type: volume
        source: dkim-keys        # per-domain private keys — persist!
        target: /var/lib/rspamd
    networks:
      - antispam

  smtp-relay:
    image: mwaeckerlin/smtp-relay
    build: smtp-relay

  smtp-relay-tls:
    image: mwaeckerlin/smtp-relay-tls
    build: smtp-relay-tls

  mailforward:
    image: mwaeckerlin/mailforward
    build: mailforward
    environment:
      LOCAL_DOMAINS: "merkur.mrw.sh localhost demo test lokal extern"
    volumes:
      - type: volume
        source: mailforward-spool   # accepted-but-undelivered forwards
        target: /var/spool/postfix

  dovecot:
    image: mwaeckerlin/dovecot
    build: dovecot
    ports:
      - "110:110"
      - "143:143"
      - "993:993"
      - "995:995"
      - "4190:4190"
    environment:
      DB_NAME: postfixadmin
      DB_USER: postfixadmin
      DB_PASSWORD: eepaiph3ohquai2Eilae-change-it
      DB_HOST: postfixadmin-db
      # Bayes autotraining via IMAPSieve: dovecot ships two global
      # sieve scripts (learn-spam.sieve / learn-ham.sieve) that fire
      # on IMAP MOVE / COPY into / out of the Junk folder and pipe
      # the message through `rspamc learn_spam` / `learn_ham` inside
      # the rspamd container. No configuration needed here — dovecot
      # only needs `rspamd` reachable on the antispam network.
      #
      # SPAM_DELIVERY_MODE — how borderline mail (accepted at SMTP
      # time, i.e. below RSPAMD_REJECT_SCORE, but tagged by rspamd
      # as suspicious) is delivered. Anything above the reject score
      # is rejected at SMTP time regardless of this setting.
      #   reject  (default) — the mailservice design: exactly two
      #           outcomes, delivered or SMTP-rejected. Nothing
      #           beyond «reject-score-reached» ever reaches this
      #           stage, so this mode is effectively a no-op.
      #   mark    — accept + add `X-Spam-Flag: YES` and related
      #           informational headers. **Never rewrites the
      #           subject and never touches the body** — anything
      #           that would break the sender's DKIM signature (or
      #           an intermediate hop's ARC seal) is forbidden.
      #           The user's MUA can filter on those headers
      #           client-side.
      #   folder  — accept + route mail with `X-Spam-Flag: YES` to
      #           the IMAP «Junk» folder via a server-side sieve
      #           rule. Silent quarantine — explicitly **not**
      #           recommended by this project (`.claude/CLAUDE.md`
      #           «Design philosophy: reliability over filtering»)
      #           but supported for admins who ask for it.
      SPAM_DELIVERY_MODE: reject
    networks:
      - postfix-backend
      - antispam                    # dovecot ⇔ rspamd (rspamc learn_*)

  postfix:
    image: mwaeckerlin/postfix
    build: postfix
    ports:
      - "25:25"
      # Trade-off: submission (587) currently maps onto the same smtpd
      # as the MX port — auth is TLS-only either way, but a dedicated
      # submission service (auth mandatory, TLS enforced, no MX
      # restrictions) would separate the two roles cleanly. See README.
      - "587:25"
    environment:
      RSPAMD: rspamd               # host or host:port, default port 11332
      HOSTNAME: merkur.mrw.sh
      HOSTROOT: mrw.sh
      DOMAIN: mrw.sh
      DB_NAME: postfixadmin
      DB_USER: postfixadmin
      DB_PASSWORD: eepaiph3ohquai2Eilae-change-it
      DB_HOST: postfixadmin-db
      # SPF is verified by rspamd's SPF module (see the rspamd
      # service above) — the perl-based policy service of v2.x is
      # gone from the headless image.
    volumes:
      # The queue MUST persist: postfix answers 250 once a mail is
      # fsync'ed into the queue — the sender never retries after that.
      # Without this volume a deferred mail silently vanishes on every
      # container recreate / image update.
      - type: volume
        source: postfix-spool
        target: /var/spool/postfix
    networks:
      - postfix-backend
      - antispam                    # postfix ⇔ rspamd milter

networks:
  postfixadmin-backend:
  postfixadmin-frontend:
  postfix-backend:
  antispam:                         # postfix ⇔ rspamd ⇔ redis + clamav

volumes:
  postfixadmin-db:
  dkim-keys:                        # rspamd's /var/lib/rspamd/dkim/
  redis-data:                       # Bayes / greylist / ratelimit state
  clamav-db:                        # virus signatures
  postfix-spool:                    # mail queue — accepted mail never vanishes
  mailforward-spool:                # mail queue of the forwarder
