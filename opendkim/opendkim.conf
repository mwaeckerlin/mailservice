Syslog            yes
LogWhy            yes
Canonicalization  relaxed/simple
# Mode is written from the DKIM_DMARC env at start-up: "s" for off (sign
# only), "sv" for log/permissive/reject (sign and verify).
SubDomains        no
OversignHeaders   From
SignatureAlgorithm rsa-sha256
Socket            inet:10026@0.0.0.0
PidFile           /run/opendkim/opendkim.pid
KeyTable          /etc/opendkim/KeyTable
SigningTable      refile:/etc/opendkim/SigningTable
# InternalHosts is written from the TRUSTED_HOSTS env at start-up — hosts
# in this list are the ones whose outgoing mail opendkim signs (SigningTable
# permitting). ExternalIgnoreList intentionally stays narrow (loopback + ::1
# only): every non-loopback sender's signature must actually be VERIFIED,
# otherwise a bad-signature or unknown-key mail from an RFC1918 test client
# would silently slip through the sign-only path.
InternalHosts     refile:/etc/opendkim/TrustedHosts
ExternalIgnoreList refile:/etc/opendkim/IgnoreHosts

# Optional: comma-separated list of nameserver IPs for DKIM key lookups,
# written from the NAMESERVERS env var at start-up if set. Bypasses the
# libc resolver — useful when the container's default resolver
# (e.g. Docker's embedded 127.0.0.11) rewrites authoritative NXDOMAIN
# responses into SERVFAIL, which opendkim then treats as tempfail
# instead of firing On-KeyNotFound. Left unset → libc resolver is used.

